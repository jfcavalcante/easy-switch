[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvmsync"
version = "0.1.0"
description = "Synchronize Bluetooth host switching between a multi-host keyboard and a multi-host mouse across Linux and Windows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "hidapi",
]

[project.optional-dependencies]
docs = ["tomli; python_version < '3.11'"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
kvmsync = "kvmsync.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kvmsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
warn_unused_configs = true
